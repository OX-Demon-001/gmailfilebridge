<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19324b"><title>GFB 파일전송</title>
<style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;max-width:650px;margin:auto;padding:20px;background:#f5f7fa;color:#15283a}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:23px}h2{font-size:18px}section{background:white;padding:18px;margin:15px 0;border:1px solid #d9e0e7;border-radius:14px}label{display:block;font-size:13px;margin:10px 0 5px}input{width:100%;font:inherit;padding:11px;border:1px solid #aab7c6;border-radius:8px}input[type=file]{border:2px dashed #8092a5;background:#f7fafc}button{font:inherit;padding:12px;border:0;border-radius:9px;background:#193e6b;color:white;cursor:pointer;margin:8px 7px 0 0}button.secondary{background:#596776}button:disabled{opacity:.5}li{padding:12px 0;border-bottom:1px solid #e7eaef;overflow-wrap:anywhere}.small{font-size:13px;color:#53677b}.tag{font-size:12px;color:#485c6d}#status{white-space:pre-wrap;overflow-wrap:anywhere}#items{padding-left:20px}</style></head>
<body><header><h1>GFB 파일전송</h1><span class="tag">모바일 · PC</span></header>
<section><strong>연결 설정</strong><label for="client">Google 웹 OAuth 클라이언트 ID</label><input id="client" placeholder="000000.apps.googleusercontent.com" autocomplete="off"><label for="peer">상대방 Gmail 주소</label><input id="peer" type="email" value="present8282@gmail.com"><button id="login">Google 계정 연결</button><button id="logout" class="secondary">연결 해제</button><p class="small">로그인 토큰은 페이지 메모리에만 유지됩니다. 브라우저 새로고침 시 재로그인이 필요합니다.</p></section>
<section><h2>파일 보내기</h2><input id="files" type="file" multiple><p class="small">HWP·HWPX·PDF·엑셀·사진 등 모든 확장자. 전체 파일 합계 12MB 이내.</p><button id="send">선택한 파일 전송</button></section>
<section><h2>받은 파일</h2><button id="refresh">수신 목록 새로고침</button><ol id="items"></ol></section>
<section><strong>진행 상태</strong><p id="status" role="status">Google 웹 OAuth 클라이언트 ID를 입력하세요.</p></section>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
const $=id=>document.getElementById(id);let accessToken='', tokenClient=null, me='';
const API='https://gmail.googleapis.com/gmail/v1/users/me/';
function status(s){$('status').textContent=s}
function b64url(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function deb64url(s){let raw=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'=='.slice((s.length+3)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
function utf8(s){return new TextEncoder().encode(s)}
function utf8decode(b){return new TextDecoder().decode(b)}
function base64mime(bytes){const temp=b64url(bytes).replace(/-/g,'+').replace(/_/g,'/');const s=temp+'='.repeat((4-temp.length%4)%4);return s.replace(/.{1,76}/g,'$&\r\n').trimEnd()}
function checkedEmail(s){if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s))throw Error('상대방 이메일 주소를 확인하세요.');return s}
async function request(path,options={}){if(!accessToken)throw Error('먼저 Google 계정을 연결하세요.');const r=await fetch(API+path,{...options,headers:{Authorization:'Bearer '+accessToken,...(options.headers||{})}});if(!r.ok)throw Error('Gmail API 오류 '+r.status+': '+(await r.text()).slice(0,350));return r.json()}
$('login').onclick=()=>{try{if(!window.google?.accounts?.oauth2)throw Error('Google 로그인 라이브러리가 아직 로드되지 않았습니다.');const client_id=$('client').value.trim();if(!client_id.endsWith('.apps.googleusercontent.com'))throw Error('Google 웹 OAuth 클라이언트 ID를 입력하세요.');tokenClient=google.accounts.oauth2.initTokenClient({client_id,scope:'https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.send',callback:async r=>{if(r.error){status('로그인 오류: '+r.error);return}accessToken=r.access_token;try{const profile=await request('profile');me=profile.emailAddress;status('연결 완료: '+me)}catch(e){status(e.message)}}});tokenClient.requestAccessToken({prompt:'consent'});}catch(e){status(e.message)}};
$('logout').onclick=()=>{if(accessToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(accessToken,()=>{});accessToken='';me='';$('items').replaceChildren();status('연결 해제됨')};
$('send').onclick=async()=>{const btn=$('send');btn.disabled=true;try{const files=[...$('files').files],peer=checkedEmail($('peer').value.trim());if(!files.length)throw Error('파일을 선택하세요.');if(files.reduce((n,f)=>n+f.size,0)>12*1024*1024)throw Error('첨부 합계가 12MB를 초과했습니다.');const boundary='GFB_'+crypto.randomUUID().replace(/-/g,'');const enc=[];const add=t=>enc.push(utf8(t));
add(`From: ${me}\r\nTo: ${peer}\r\nSubject: [GFB-FILE] ${Date.now()}\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n`);
add(`--${boundary}\r\nContent-Type: text/plain; charset=utf-8\r\n\r\nGmailFileBridge file transfer\r\n`);
for(const file of files){status('전송 준비: '+file.name);const data=new Uint8Array(await file.arrayBuffer());const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),x=>x.toString(16).padStart(2,'0')).join('');const safe=file.name.replace(/[\r\n]/g,'');add(`--${boundary}\r\nContent-Type: application/octet-stream\r\nContent-Disposition: attachment; filename="file.bin"; filename*=UTF-8''${encodeURIComponent(safe)}\r\nContent-Transfer-Encoding: base64\r\nX-GFB-Name: ${b64url(utf8(file.name))}\r\nX-GFB-SHA256: ${sha}\r\n\r\n${base64mime(data)}\r\n`)}add(`--${boundary}--\r\n`);
const len=enc.reduce((n,a)=>n+a.length,0),raw=new Uint8Array(len);let pos=0;for(const c of enc){raw.set(c,pos);pos+=c.length}const res=await request('messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw:b64url(raw)})});status('전송 완료 · Gmail 메시지 ID: '+res.id);$('files').value='';}catch(e){status('전송 실패: '+e.message)}finally{btn.disabled=false}};
function attachments(p){return [p,...(p?.parts||[]).flatMap(attachments)].filter(v=>v?.body?.attachmentId)}
$('refresh').onclick=async()=>{try{const peer=checkedEmail($('peer').value.trim());status('수신 목록 확인 중…');const q='subject:[GFB-FILE] in:anywhere -in:trash'+(peer!==me?` from:${peer} to:${me}`:'');const results=await request('messages?maxResults=30&q='+encodeURIComponent(q));const root=$('items');root.replaceChildren();let count=0;for(const m of results.messages||[]){const full=await request('messages/'+encodeURIComponent(m.id)+'?format=full');const hdr=Object.fromEntries((full.payload.headers||[]).map(x=>[x.name.toLowerCase(),x.value]));if(peer!==me&&!String(hdr.from||'').includes(peer))continue;for(const part of attachments(full.payload)){const headers=Object.fromEntries((part.headers||[]).map(h=>[h.name.toLowerCase(),h.value]));if(!headers['x-gfb-name'])continue;const filename=utf8decode(deb64url(headers['x-gfb-name']));const li=document.createElement('li'),name=document.createElement('div');name.textContent=filename;li.append(name);const detail=document.createElement('div');detail.className='small';detail.textContent=new Date(Number(full.internalDate)).toLocaleString()+' · '+(hdr.from||'');li.append(detail);const btn=document.createElement('button');btn.textContent='파일 저장';btn.onclick=async()=>{btn.disabled=true;try{status('다운로드 중: '+filename);const result=await request(`messages/${encodeURIComponent(m.id)}/attachments/${encodeURIComponent(part.body.attachmentId)}`);const data=deb64url(result.data);const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),x=>x.toString(16).padStart(2,'0')).join('');if(headers['x-gfb-sha256']&&sha!==headers['x-gfb-sha256'].trim().toLowerCase())throw Error('파일 해시 불일치');const url=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status('다운로드 요청 완료: '+filename+' (모바일 브라우저의 다운로드 목록을 확인하세요)')}catch(e){status('저장 실패: '+e.message)}finally{btn.disabled=false}};li.append(btn);root.append(li);count++}}status('수신 파일 '+count+'개 조회됨')}catch(e){status('조회 실패: '+e.message)}};
</script></body></html>
